<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        KeSanaSini
        {% endblock %}
    </title>


    <!-- CSS GLOBAL -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CSS KHUSUS HALAMAN -->

    {% block css %}
    {% endblock %}

</head>


<body class="user-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="{{ url_for('main.index') }}"
           class="navbar-logo">

            <img
                src="{{ url_for('static', filename='images/logo-navbar.png') }}"
                alt="KeSanaSini"
            >

        </a>


        <nav class="nav-menu">

            <a href="{{ url_for('main.index') }}"
            class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}">
                Menu Utama
            </a>

            <a href="#"
               class="nav-link">

                Pesanan Saya

            </a>

            <a href="#"
               class="nav-link">

                Riwayat Pesanan

            </a>

        </nav>


        {% if user %}

        <div class="user-menu">

            <div class="user-icon">

                <i class="fa-regular fa-user"></i>

            </div>


            <span class="user-email">

                {{ user.email }}

            </span>


            <i class="fa-solid fa-chevron-down user-arrow"></i>


            <div class="user-dropdown">

                <div class="dropdown-profile">
                    <div class="dropdown-profile-photo">
                        <i class="fa-regular fa-user"></i>
                    </div>

                    <div class="dropdown-profile-info">
                        <strong>{{ user.name }}</strong>
                        <span class="dropdown-profile-email"
                            title="{{ user.email }}">
                            {{ user.email }}
                        </span>
                    </div>
                </div>

                <div class="dropdown-menu-list">

                    <a href="{{ url_for('main.kelola_akun') }}">
                        <i class="fa-regular fa-user"></i>
                        <span>Data Diri</span>
                    </a>

                    <a href="#">
                        <i class="fa-solid fa-receipt"></i>
                        <span>Pesanan Terkini</span>
                    </a>

                    <a href="#">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Riwayat Pesanan</span>
                    </a>

                    <a href="#">
                        <i class="fa-regular fa-bell"></i>
                        <span>Notifikasi</span>
                    </a>

                    <a href="{{ url_for('main.logout') }}">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Logout</span>
                    </a>

                </div>

            </div>

        </div>

        {% endif %}

    </header>


    <!-- ISI HALAMAN -->

    {% block content %}
    {% endblock %}


    <!-- FOOTER -->

    <footer class="footer">

    </footer>


    <!-- JAVASCRIPT GLOBAL -->

    <script>

        const userMenu =
            document.querySelector('.user-menu');


        if (userMenu) {

            userMenu.addEventListener(
                'click',
                function () {

                    this.classList.toggle('open');

                }
            );

        }

    </script>

</body>

</html>
