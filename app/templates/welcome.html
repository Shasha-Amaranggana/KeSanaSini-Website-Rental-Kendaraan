<!-- ═════════════════════════════════════════════════════════════
    HTML TAMPILAN OPENING WEBSITE KeSanaSini
    ⤷ Mengatur bagian tampilan opening website saat pertama kali dibuka.
═════════════════════════════════════════════════════════════ -->


<!DOCTYPE html>
<html lang="id">


<!-- ═════════════════════════════════════════════════════════════
    A.   HEAD/TAJUK
═════════════════════════════════════════════════════════════ -->
<head>

    <!-- ════════════════════════════════════════════════════ -->
    <!--     1.    INFORMASI DASAR HALAMAN                    -->
    <!-- ════════════════════════════════════════════════════ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KeSanaSini</title>


    <!-- ════════════════════════════════════════════════════ -->
    <!--     2.     CSS KHUSUS HALAMAN WELCOME                    -->
    <!-- ════════════════════════════════════════════════════ -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/welcome.css') }}">



    <!-- ════════════════════════════════════════════════════ -->
    <!--     4.     LOGO KECIL DI BAR WEBSITE                        -->
    <!-- ════════════════════════════════════════════════════ -->
    <link
        rel="icon"
        type="image/jpg"
        href="{{ url_for('static', filename='images/logo1.png') }}?v=2">

        
</head>



<!-- ═════════════════════════════════════════════════════════════
    B.   BODY/ISI
═════════════════════════════════════════════════════════════ -->
<body>

    <!-- ════════════════════════════════════════════════════ -->
    <!--     3.     HALAMAN WELCOME                               -->
    <!--            Berisi background, logo, dan petunjuk pengguna. -->
    <!-- ════════════════════════════════════════════════════ -->
    <main class="welcome-page">

        <!-- 3.1. LAPISAN BACKGROUND -->
        <!-- ═════════════════════════════════ -->
        <div class="welcome-overlay"></div>

        <!-- 3.2. LOGO WEBSITE -->
        <!-- ═════════════════════════════════ -->
        <button
            class="welcome-logo"
            id="welcomeLogo"
            type="button"
            aria-label="Masuk ke KeSanaSini">
            <img
                src="{{ url_for('static', filename='images/logo1.png') }}"
                alt="Logo KeSanaSini">
        </button>

        <!-- 3.3. PETUNJUK PENGGUNA -->
        <!-- ═════════════════════════════════ -->
        <p class="welcome-text">
            Klik logo untuk melanjutkan
        </p>

    </main>



    <!-- ═════════════════════════════════════════════════════════════
        C.   JAVASCRIPT
    ═════════════════════════════════════════════════════════════ -->

    <!-- ════════════════════════════════════════════════════ -->
    <!--     4.    INTERAKSI LOGO DAN NAVIGASI LOGIN              -->
    <!--           Menjalankan animasi keluar sebelum berpindah   -->
    <!--           ke halaman login.                              -->
    <!-- ════════════════════════════════════════════════════ -->
    <script>

        // Mengambil elemen halaman dan logo
        const welcomePage = document.querySelector('.welcome-page');
        const welcomeLogo = document.getElementById('welcomeLogo');

        // Menangani klik pada logo
        welcomeLogo.addEventListener('click', function () {

            // Tambahkan animasi keluar
            welcomePage.classList.add('exit');

            // Tunggu animasi selesai sebelum pindah halaman
            setTimeout(function () {
                window.location.href = "{{ url_for('main.login') }}";
            }, 550);

        });

    </script>

</body>
</html>
